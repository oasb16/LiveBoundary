[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "liveboundary"
version = "0.1.0"
description = "Research tooling for persistent, boundary-guided online adaptation of native neural parameters"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "LiveBoundary contributors"}]
dependencies = ["torch>=2.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
]

[project.optional-dependencies]
hf = ["transformers>=4.40"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.6"]

[project.scripts]
liveboundary-benchmark = "liveboundary.benchmarks:main"
liveboundary-strict-inference = "liveboundary.strict_inference:main"

[tool.hatch.build.targets.wheel]
packages = ["src/liveboundary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: bounded empirical learning checks"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]

