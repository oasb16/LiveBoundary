<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LiveBoundary</title>
  <desc id="desc">Persistent boundary-guided online adaptation for native PyTorch parameters</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.52" stop-color="#17113a"/>
      <stop offset="1" stop-color="#071b25"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.48" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".55"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="230" cy="210" r="250" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="1040" cy="95" r="170" fill="#0ea5e9" opacity=".08" filter="url(#soft)"/>

  <g opacity=".34" stroke="#38bdf8" fill="none">
    <path d="M60 87 C155 50 181 133 271 98 S407 45 477 90"/>
    <path d="M738 330 C820 286 870 370 948 326 S1072 272 1146 314"/>
    <circle cx="60" cy="87" r="4" fill="#38bdf8"/>
    <circle cx="271" cy="98" r="4" fill="#38bdf8"/>
    <circle cx="477" cy="90" r="4" fill="#38bdf8"/>
    <circle cx="738" cy="330" r="4" fill="#38bdf8"/>
    <circle cx="948" cy="326" r="4" fill="#38bdf8"/>
    <circle cx="1146" cy="314" r="4" fill="#38bdf8"/>
  </g>

  <g transform="translate(92 122)" filter="url(#shadow)">
    <path d="M86 0 160 34v60c0 58-30 99-74 122C42 193 12 152 12 94V34Z" fill="#0f172a" stroke="url(#brand)" stroke-width="5"/>
    <path d="M54 108 77 131 123 79" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="86" cy="34" r="8" fill="#a78bfa"/>
    <circle cx="30" cy="70" r="7" fill="#38bdf8"/>
    <circle cx="142" cy="70" r="7" fill="#38bdf8"/>
  </g>

  <g transform="translate(310 108)">
    <text x="0" y="76" fill="#f8fafc" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="80" font-weight="800" letter-spacing="-3">LiveBoundary</text>
    <rect x="2" y="96" width="760" height="5" rx="2.5" fill="url(#brand)"/>
    <text x="2" y="145" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">LEARN FACTS  ·  ENFORCE LIMITS  ·  PROMOTE SAFELY</text>
    <text x="2" y="193" fill="#94a3b8" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="20">Persistent, boundary-guided adaptation for native PyTorch parameters</text>
    <g transform="translate(2 225)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">
      <rect width="134" height="34" rx="17" fill="#7c3aed"/><text x="67" y="22" text-anchor="middle" fill="white">REAL GRADIENTS</text>
      <rect x="146" width="146" height="34" rx="17" fill="#0369a1"/><text x="219" y="22" text-anchor="middle" fill="white">ATOMIC VERSIONS</text>
      <rect x="304" width="142" height="34" rx="17" fill="#047857"/><text x="375" y="22" text-anchor="middle" fill="white">FAILURE VISIBLE</text>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="26.5" fill="none" stroke="url(#brand)" stroke-opacity=".55" stroke-width="3"/>
</svg>
